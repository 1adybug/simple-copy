[package]
name = "simple-copy"
version = "0.1.0"
edition = "2024"
description = "A local desktop clipboard manager"

[lib]
name = "simple_copy"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
bincode = "1.3"
clipboard-rs = "0.3.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff"] }
keyring = { version = "4.2", default-features = false, features = ["v1"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["macros", "sync", "time"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "UI_ViewManagement"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_DataExchange",
  "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging",
] }
